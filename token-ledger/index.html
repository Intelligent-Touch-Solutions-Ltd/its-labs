<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Token Ledger — a traffic-shape design workbench</title>
<style>
:root{
  /* iTouch brand: monochrome foundation + radial colour 'touch' accents.
     ACCENT PLACEHOLDERS — swap --touch-a/b/c for the exact brand gradient hexes. */
  --touch-a:#7B2FF7; --touch-b:#F72F8E; --touch-c:#F7A82F;
  --navy:#0A0A0A; --gold:var(--touch-a); --blue:#525252;
  --ink:#161616; --muted:#6E6E6E; --paper:#FAFAFA; --card:#FFFFFF;
  --line:#E6E6E6; --green:#6D28D9; --red:#C2244B; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,'Helvetica Neue','Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;font-size:15.5px}
h1,h2,h3,.disp{font-family:'Helvetica Neue',Inter,'Segoe UI',Arial,sans-serif;letter-spacing:-0.01em}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}

header{background:var(--navy);color:#fff;padding:44px 0 38px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-140px;top:-140px;width:440px;height:440px;border-radius:50%;
  background:radial-gradient(circle at 32% 32%, rgba(247,47,142,.34) 0%, rgba(123,47,247,.20) 42%, rgba(247,168,47,0) 72%)}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
header h1{font-size:clamp(28px,4.2vw,42px);line-height:1.1;max-width:820px}
header p{margin-top:14px;max-width:740px;color:#D2D2D2;font-size:16.5px}

main{padding:34px 0 60px}
.grid{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 8px;margin-bottom:20px}
.panel h3{font-size:16px;color:var(--navy);margin-bottom:4px}
.panel .ph{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.ctrl{margin-bottom:16px}
.ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:5px;gap:8px}
.ctrl label output{font-family:'Helvetica Neue',Inter,'Segoe UI',Arial,sans-serif;color:var(--blue);white-space:nowrap}
.ctrl .why{font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}
input[type=range]{width:100%;accent-color:#0A0A0A;height:24px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--muted);flex:1;min-width:0;white-space:nowrap}
.seg.on{border-color:var(--navy);background:var(--navy);color:#fff}
.seg.gold.on{border-color:var(--gold);background:#F5F0FF;color:#5B21B6}
.tgl{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px dashed var(--line)}
.tgl:first-of-type{border-top:none}
.switch{width:42px;height:24px;border-radius:12px;background:#DCDCDC;position:relative;border:none;flex:none;transition:background .18s;margin-top:1px}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--gold)}
.switch.on::after{left:21px}
.tgl .tn{font-weight:700;color:var(--navy);font-size:13.5px}
.tgl .td{font-size:12px;color:var(--muted)}
.prices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.prices .pc{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prices .pc .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prices input[type=number]{width:100%;border:none;font-family:'Helvetica Neue',Inter,'Segoe UI',Arial,sans-serif;font-size:16px;color:var(--navy);font-weight:700;background:transparent}
.finenote{font-size:11.5px;color:var(--muted);margin:2px 0 12px}

/* results */
.hero{background:var(--navy);color:#fff;border-radius:var(--radius)
